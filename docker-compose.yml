services:
  solver:
    build: .
    image: turnstile-solver:latest
    container_name: turnstile-solver
    init: true
    restart: unless-stopped
    # Chrome needs a large /dev/shm or it will crash renderer processes.
    shm_size: "2gb"
    ports:
      - "${TOKEN_SERVER_PORT:-8080}:8080"
      # Set ENABLE_VNC=1 to peek at the virtual display.
      - "${VNC_PORT:-5900}:5900"
      - "127.0.0.1:9222:9223"
    environment:
      TARGET_URL: "${TARGET_URL:-}"
      SCREEN_WIDTH: "${SCREEN_WIDTH:-1920}"
      SCREEN_HEIGHT: "${SCREEN_HEIGHT:-1080}"
      CLICKER_ENABLED: "${CLICKER_ENABLED:-1}"
      ENABLE_VNC: "${ENABLE_VNC:-0}"
      VNC_PORT: "5900"
      BROWSER_COUNT: "${BROWSER_COUNT:-1}"
      CHROME_NO_SANDBOX: "${CHROME_NO_SANDBOX:-1}"
      PAGE_OVERRIDE: "${PAGE_OVERRIDE:-0}"
      CHROME_REMOTE_DEBUGGING: "${CHROME_REMOTE_DEBUGGING:-1}"
      CDP_PORT: "9222"
      CDP_URL: "http://127.0.0.1:9222"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./config:/app/config
      - chrome-profile:/data
    # Uncomment for a real GPU (better WebGL fingerprint than llvmpipe):
    # gpus: all
    #
    # --no-sandbox is on by default (CHROME_NO_SANDBOX=1). That disables
    # Chrome's renderer/utility sandbox: a Chrome exploit becomes a
    # container-user compromise. Keep the published CDP port on 127.0.0.1
    # and do not point TARGET_URL at untrusted pages. To try Chrome's real
    # sandbox instead:
    #   CHROME_NO_SANDBOX=0
    #   cap_add: [SYS_ADMIN]
    #   security_opt: [seccomp=unconfined]
    # See README "Chrome --no-sandbox".

volumes:
  chrome-profile:
