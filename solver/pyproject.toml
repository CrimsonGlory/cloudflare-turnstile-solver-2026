[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turnstile-solver"
version = "0.1.0"
description = "Client for the Cloudflare Turnstile solver browser cookie server"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["solver*"]
